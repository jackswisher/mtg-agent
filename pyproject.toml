[project]
name = "mtg-causal-rl"
version = "0.1.0"
description = "Causal Reinforcement Learning Benchmark for Magic: The Gathering"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Anonymous", email = "author@example.com" }
]
requires-python = ">=3.10"
keywords = ["reinforcement-learning", "causal-inference", "magic-the-gathering", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.2.0",
    "sb3-contrib>=2.2.0",
    "torch>=2.0.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tensorboard>=2.14.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/anonymous/mtg-causal-rl"
Repository = "https://github.com/anonymous/mtg-causal-rl"
Documentation = "https://github.com/anonymous/mtg-causal-rl#readme"

[project.scripts]
mtg-train = "scripts.runner.run_training:main"
mtg-eval = "scripts.runner.run_evaluation:main"
mtg-gameplay = "scripts.runner.run_gameplay:main"
mtg-research = "scripts.research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mtg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes (F401=unused imports, F841=unused variables)
    "W",      # pycodestyle warnings
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D107",   # Missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py (re-exports are intentional)
"__init__.py" = ["F401"]
# Allow unused imports in test files (fixtures may appear unused)
"tests/*" = ["F401"]
# HTML report has long HTML strings that are hard to break
"mtg/utils/html_report.py" = ["E501"]
# CLI display has long Rich format strings
"mtg/utils/cli_display.py" = ["E501"]
# Card definitions have long rules_text / description data strings
"mtg/env/card_definitions.py" = ["E501"]
# Runner scripts have long Rich console format strings
"scripts/runner/*" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=mtg --cov-report=term-missing -m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[dependency-groups]
# PEP 735 dev group. uv installs this by default on `uv sync` (no --extra
# needed). Keep in sync with [project.optional-dependencies] dev above so
# that `pip install -e ".[dev]"` and `uv sync` both yield a fully-tooled
# environment.
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]
